name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: leanprover/lean-action@v1
        with:
          test: false

      - name: Check Keccak-256 vectors
        run: lake build Ethereum.SpongeHash.Keccak256Tests
